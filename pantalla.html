<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantalla · Baby Shower de Justino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/img/globo-azul.svg" type="image/svg+xml">
<style>
  html,body{height:100%;overflow:hidden}
  body{background-image:linear-gradient(rgba(243,238,229,.35),rgba(243,238,229,.35)),url("assets/img/mapa.jpg");background-size:cover;cursor:none}
  #sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #sky img{position:absolute;bottom:-40vh;animation:rise linear infinite}
  @keyframes rise{from{transform:translateY(0) translateX(0)}50%{transform:translateY(-75vh) translateX(3vw)}to{transform:translateY(-150vh) translateX(0)}}
  #sky .plane{bottom:auto;top:12vh;left:-20vw;width:16vw;animation:cross 38s linear infinite;opacity:.9}
  @keyframes cross{from{transform:translateX(0) rotate(-3deg)}to{transform:translateX(140vw) rotate(-3deg)}}
  #clouds{position:fixed;left:0;right:0;bottom:0;height:22vh;width:100%;pointer-events:none;z-index:0}
  #stage{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 5vw;text-align:center}
  .name{font-family:var(--script);color:var(--blue);font-size:13vw;line-height:.9;margin:0;text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .sub{font-family:var(--display);font-weight:600;color:var(--sand);font-size:4vw;margin:0}
  .t-l{font-family:var(--display);font-weight:600;font-size:4vw;line-height:1.1;margin:0 0 2vh;color:var(--ink)}
  .t-m{font-family:var(--display);font-style:italic;font-size:2.2vw;color:var(--muted);margin:1vh 0}
  .boarding{display:flex;align-items:stretch;background:var(--paper);border-radius:1.2vw;box-shadow:0 1vw 4vw rgba(91,74,59,.18);margin-top:3vh;overflow:hidden;border:1px solid var(--line)}
  .boarding .qr{padding:1.6vw;background:#fff;border-right:.25vw dashed var(--line)}
  .boarding .qr img,.boarding .qr canvas{display:block}
  .boarding .txt{padding:2vw 3vw;text-align:left;display:flex;flex-direction:column;justify-content:center}
  .boarding .lbl{font-size:1.1vw;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .boarding .big{font-family:var(--display);font-weight:700;font-size:3.4vw;color:var(--blue-d);line-height:1.05}
  #corner{position:fixed;right:1.5vw;bottom:2vh;z-index:2;background:var(--paper);border:1px solid var(--line);border-radius:1vw;padding:.7vw;text-align:center;font-family:var(--display);font-weight:700;color:var(--blue-d);font-size:1.1vw;box-shadow:var(--shadow)}
  #corner .qr img,#corner .qr canvas{display:block;margin:0 auto .3vw}
  /* galería polaroid */
  .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s}
  .slide.on{opacity:1}
  .polaroid{background:#fff;padding:1.2vw 1.2vw 5.5vw;box-shadow:0 1.5vw 5vw rgba(91,74,59,.28);position:relative}
  .polaroid img{display:block;max-width:80vw;max-height:72vh}
  .polaroid .who{position:absolute;left:0;right:0;bottom:1.2vw;font-family:var(--script);font-size:3vw;color:var(--ink)}
  /* pregunta */
  .bars{width:min(90vw,1400px);margin-top:2vh}
  .bar{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:.8vw;margin:1.2vh 0;height:8.5vh;overflow:hidden;text-align:left;box-shadow:var(--shadow)}
  .bar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c9d9dc,#a9c3c9);transition:width .7s}
  .bar .lbl{position:absolute;left:2vw;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:2.8vw;font-weight:700}
  .bar .n{position:absolute;right:2vw;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:2.6vw;font-weight:700;color:var(--blue-d)}
  .bar.right{border:.25vw solid var(--ok)} .bar.right .fill{background:linear-gradient(90deg,#d3e5d6,#b4d3ba)}
  .bar.dim{opacity:.4}
  .qwrap{display:flex;gap:3vw;align-items:center;justify-content:center;width:100%}
  .qwrap .polaroid{padding:.8vw .8vw 1.6vw;transform:rotate(-2deg)}
  .qwrap .polaroid img{max-height:56vh;max-width:34vw}
  /* ranking */
  .rank{width:min(75vw,1100px)}
  .rank div{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:.6vw solid var(--blue);border-radius:.8vw;padding:1.2vh 2vw;margin:1vh 0;font-family:var(--display);font-size:2.6vw;font-weight:700;box-shadow:var(--shadow)}
  .rank div:nth-child(1){border-left-color:#c9a86a;font-size:3.2vw}
  .rank div span:last-child{color:var(--blue-d)}
  /* postales */
  .postcard{display:flex;width:min(82vw,1300px);min-height:52vh;background:#fdfaf3;border-radius:.6vw;box-shadow:0 1.5vw 5vw rgba(91,74,59,.25);padding:3vw;gap:3vw;text-align:left;transition:opacity .8s,transform .8s;transform:rotate(-1deg)}
  .postcard .msg{flex:1.6;font-family:var(--display);font-style:italic;font-size:3vw;line-height:1.3;display:flex;flex-direction:column;justify-content:center;border-right:.15vw solid var(--line);padding-right:3vw}
  .postcard .msg .from{font-family:var(--script);font-style:normal;font-size:3.4vw;color:var(--blue-d);margin-top:2vh}
  .postcard .addr{flex:1;display:flex;flex-direction:column;justify-content:space-between}
  .stamp{align-self:flex-end;width:9vw;padding:.6vw;background:#fff;border:.4vw dotted var(--line);transform:rotate(4deg)}
  .stamp img{display:block;width:100%}
  .postmark{position:absolute;margin:-1vw 0 0 -3vw;width:10vw;height:10vw;border:.2vw solid rgba(90,128,138,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1vw;color:rgba(90,128,138,.75);transform:rotate(-14deg);text-align:center;line-height:1.2}
  .addr .to{font-family:var(--display);font-size:2.2vw;border-bottom:.12vw solid var(--line);padding:1vh 0}
  .addr .to b{font-family:var(--script);font-weight:400;font-size:4vw;color:var(--blue)}
  /* predicciones */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;width:min(90vw,1400px)}
  .stats div{background:var(--paper);border:1px solid var(--line);border-radius:1vw;padding:3vh 1vw;box-shadow:var(--shadow)}
  .stats b{display:block;font-family:var(--display);font-weight:700;font-size:3.8vw;color:var(--blue-d)}
  .stats span{font-family:var(--display);font-style:italic;font-size:1.8vw;color:var(--muted)}
  #hint{position:fixed;top:1vh;left:50%;transform:translateX(-50%);font-size:14px;color:var(--muted);transition:opacity 1s;z-index:3}
</style>
</head>
<body>
<div id="sky">
  <img class="plane" src="assets/img/avion.svg" alt="">
  <img src="assets/img/globo-azul.svg" alt="" style="left:6vw;width:7vw;animation-duration:46s;animation-delay:-8s">
  <img src="assets/img/globo-arena.svg" alt="" style="left:84vw;width:5vw;animation-duration:58s;animation-delay:-30s">
  <img src="assets/img/globo-azul.svg" alt="" style="left:70vw;width:3.5vw;animation-duration:70s;animation-delay:-50s;opacity:.7">
  <img src="assets/img/globo-arena.svg" alt="" style="left:22vw;width:3vw;animation-duration:80s;animation-delay:-20s;opacity:.6">
</div>
<img id="clouds" src="assets/img/nubes.svg" alt="">
<div id="stage"></div>
<div id="corner" class="hidden"><div class="qr" id="qr-small"></div>¡Escaneá y jugá!</div>
<div id="hint">Click para pantalla completa · tecla V: leer las postales en voz alta</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/pantalla.js"></script>
</body>
</html>
