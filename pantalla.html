<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantalla del Baby Shower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(circle at 15% 15%,#fde7dd 0,transparent 40%),radial-gradient(circle at 85% 20%,#e3f0ea 0,transparent 40%),radial-gradient(circle at 50% 110%,#fdf1d3 0,transparent 55%),var(--bg);cursor:none}
  #stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 5vw;text-align:center}
  .t-xl{font-family:Fredoka;font-size:7vw;line-height:1.05;margin:0}
  .t-l{font-family:Fredoka;font-size:4vw;line-height:1.1;margin:0 0 2vh}
  .t-m{font-size:2.2vw;color:var(--muted);margin:1vh 0}
  .qr{background:#fff;padding:1.5vw;border-radius:2vw;box-shadow:var(--shadow);display:inline-block}
  .qr img,.qr canvas{display:block}
  #corner{position:fixed;right:2vw;bottom:2vh;text-align:center;font-weight:700;color:var(--muted);font-size:1.1vw}
  #corner .qr{padding:.6vw;border-radius:1vw}
  .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1s}
  .slide.on{opacity:1}
  .slide img{max-width:92vw;max-height:84vh;border-radius:1.5vw;box-shadow:0 1vw 4vw rgba(0,0,0,.18);border:.6vw solid #fff}
  .slide .who{position:absolute;bottom:3vh;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);padding:.6vh 1.6vw;border-radius:99px;font-size:1.6vw;font-weight:700}
  .bars{width:min(90vw,1400px);margin-top:2vh}
  .bar{position:relative;background:#fff;border:.25vw solid var(--line);border-radius:1.2vw;margin:1.2vh 0;height:8vh;overflow:hidden;text-align:left}
  .bar .fill{position:absolute;inset:0 auto 0 0;background:#e3f0ea;transition:width .6s}
  .bar .lbl{position:absolute;left:2vw;top:50%;transform:translateY(-50%);font-size:2.6vw;font-weight:700}
  .bar .n{position:absolute;right:2vw;top:50%;transform:translateY(-50%);font-size:2.4vw;font-weight:700;color:var(--muted)}
  .bar.right{border-color:var(--ok)} .bar.right .fill{background:#bfe3c9}
  .bar.dim{opacity:.45}
  .qwrap{display:flex;gap:3vw;align-items:center;justify-content:center;width:100%}
  .qwrap img{max-height:60vh;max-width:38vw;border-radius:1.5vw;border:.5vw solid #fff;box-shadow:var(--shadow)}
  .rank{width:min(80vw,1100px)}
  .rank div{display:flex;justify-content:space-between;background:#fff;border-radius:1.2vw;padding:1.4vh 2vw;margin:1vh 0;font-size:2.6vw;font-weight:700;box-shadow:var(--shadow)}
  .rank div:nth-child(1){background:#fdf1d3;font-size:3.2vw}
  .wish{font-family:Fredoka;font-size:3.6vw;line-height:1.25;max-width:80vw;transition:opacity .8s}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;width:min(90vw,1400px)}
  .stats div{background:#fff;border-radius:1.5vw;padding:3vh 1vw;box-shadow:var(--shadow)}
  .stats b{display:block;font-family:Fredoka;font-size:4vw}
  .stats span{font-size:1.6vw;color:var(--muted)}
  #hint{position:fixed;top:1vh;left:50%;transform:translateX(-50%);font-size:14px;color:var(--muted);transition:opacity 1s}
</style>
</head>
<body>
<div id="stage"></div>
<div id="corner" class="hidden"><div class="qr" id="qr-small"></div><div>¡Escaneá y jugá!</div></div>
<div id="hint">Click para pantalla completa · tecla V: activar voz en los deseos</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/pantalla.js"></script>
</body>
</html>
