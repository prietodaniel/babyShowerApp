<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" preserveAspectRatio="none">
  <defs>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="6"/>
    </filter>
  </defs>
  <g filter="url(#soft)" fill="#c8ced0">
    <ellipse cx="80" cy="140" rx="140" ry="60" opacity=".55"/>
    <ellipse cx="260" cy="150" rx="150" ry="55" opacity=".45"/>
    <ellipse cx="470" cy="145" rx="170" ry="60" opacity=".5"/>
    <ellipse cx="690" cy="135" rx="160" ry="70" opacity=".55"/>
    <ellipse cx="380" cy="175" rx="420" ry="50" fill="#dfe3e3" opacity=".8"/>
  </g>
</svg>
